name: React CI Build

run-name: Pipeline run by @${{ github.actor }} (#${{ github.run_number }})

on:
  push:
    branches:
      - feature/action
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ၁။ Repository ထဲရှိ Code များကို စက်ထဲသို့ ဆွဲယူခြင်း
      - name: Checkout code
        uses: actions/checkout@v3

      # ၂။ Node.js Environment ကို Setup လုပ်ခြင်း
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ၃။ Dependencies များကို Install လုပ်ခြင်း
      - name: Install dependencies
        run: npm ci

      # ၄။ Repository Variable ကို အသုံးပြု၍ Environment ကို စစ်ဆေးခြင်း
      - name: Check Environment Variable
        run: echo "Running build for environment -> ${{ vars.APP_ENV }}"

      # ၅။ React Project ကို Build လုပ်ခြင်း
      - name: Build project
        run: npm run build

      # ၆။ Secret ကို အသုံးပြု၍ Deploy (သို့မဟုတ်) API ချိတ်ဆက်ခြင်း သဥ္ဇာာ
      - name: Deploy or Connect via API Token
        run: |
          echo "Using API Token securely..."
          # ဥပမာအနေဖြင့် API_TOKEN ကို command ထဲတွင် လုံခြုံစွာ ခေါ်သုံးပုံ
          # (Log ထဲတွင် ပေါ်လာမည်မဟုတ်ဘဲ Mask လုပ်ပေးသွားပါမည်)
          echo "Token length is active."
        env:
          MY_API_TOKEN: ${{ secrets.API_TOKEN }}