name: Create Issue on Failure

# ၁။ Inputs များကို လက်ခံရန် Triggers များကို သတ်မှတ်ခြင်း
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Issue title'
        required: true
        type: string
      body:
        description: 'Issue body'
        required: true
        type: string

  workflow_call:
    inputs:
      title:
        required: true
        type: string
      body:
        required: true
        type: string

# ၂။ Job နှင့် Step များအတွင်း Inputs ကို ခေါ်သုံးခြင်း
jobs:
  create_issue:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write

    steps:
      - name: Create issue using REST API
        run: |
          curl --request POST \
            --url https://api.github.com/repos/${{ github.repository }}/issues \
            --data '{
              "title": "Failure: ${{ inputs.title }}",
              "body": "Details: ${{ inputs.body }}"
            }' \
            --fail