name: Capturing Action Output Example

# ၁။ feature/action branch သို့ push လုပ်မှသာ အလုပ်လုပ်ရန် Trigger သတ်မှတ်ခြင်း
on:
  push:
    branches:
      - feature/action

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    outputs:
      # Step တစ်ခုအတွင်းမှ ရလာသည့် Output ကို Job Output အဖြစ်သို့ Mapping လုပ်ခြင်း
      version-tag: ${{ steps.changelog.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ၂။ Third-party Action တစ်ခုကို အသုံးပြုပြီး Output ကို ဖမ်းယူခြင်း
      - name: Conventional Changelog Action
        id: changelog   # အခြား Step တွေက ခေါ်သုံးရန် ID ပေးထားခြင်း
        uses: TriPSs/conventional-changelog-action@v3.14.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ၃။ ယခင် Step က ထွက်လာသော Output တန်ဖိုးကို ဤ Step တွင် ပြန်လည်အသုံးပြုခြင်း
      - name: Print Version Output
        run: |
          echo "The generated version is: ${{ steps.changelog.outputs.version }}"