name: Reusable Issue Creator

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      body:
        required: true
        type: string

jobs:
  create_issue_on_failure:
    runs-on: ubuntu-latest
    permissions:
      issues: write # Grants permission to create issues via GITHUB_TOKEN

    steps:
      - name: Create issue using GitHub REST API
        run: |
          curl --request POST \
          --url https://api.github.com/repos/${{ github.repository }}/issues \
          --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
          --header 'content-type: application/json' \
          --data '{
            "title": "Failure: ${{ inputs.title }}",
            "body": "Details: ${{ inputs.body }}"
          }' \
          --fail